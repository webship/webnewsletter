---
##############################################################################
#
#  Drupal GitLab CI template for Web Newsletter module
#
#  Based on the official Drupal Association template from:
#  https://git.drupalcode.org/project/gitlab_templates
#
##############################################################################

include:
  - project: 'project/gitlab_templates'
    ref: '1.7.0'
    file:
      - '/includes/include.drupalci.main.yml'
      - '/includes/include.drupalci.variables.yml'
      - '/includes/include.drupalci.workflows.yml'

# Uncomment this line for Drupal 7 projects
# - '/includes/include.drupalci.main-d7.yml'

##############################################################################
#
# Variables
#
# Customize your pipeline by overriding variables here.
# For a full list of available variables, see:
# https://git.drupalcode.org/project/gitlab_templates/-/blob/main/includes/include.drupalci.variables.yml
#
##############################################################################

variables:
  # Opt-in to test against Drupal next minor version
  OPT_IN_TEST_NEXT_MINOR: 1

  # Skip jobs that are not needed (set to 1 to skip)
  # SKIP_PHPCS: 1
  # SKIP_PHPSTAN: 1
  # SKIP_ESLINT: 1
  # SKIP_STYLELINT: 1

# Uncomment below to customize specific jobs
# Example: Make phpcs job fail the pipeline
# phpcs:
#   allow_failure: false

# Example: Add custom configuration to phpunit
# phpunit:
#   script:
#     - echo "Running custom PHPUnit configuration"
#     - !reference [.default-job-before-script]
#     - cd "$CI_PROJECT_DIR/$_WEB_ROOT/modules/custom/$CI_PROJECT_NAME"
